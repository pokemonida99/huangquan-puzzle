<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>黃泉燒肉店 轉珠試玩版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&text=%E9%BB%83%E6%B3%89%E7%87%92%E8%82%89%E5%BA%97%E5%A6%82%E5%85%A5%E7%81%AB%E8%81%9A%E5%BE%97%E6%B8%85%E6%B6%BC%E9%96%80%E9%BB%9E%E4%B8%80%E4%B8%8B%E9%80%B2%E5%85%A5&display=swap">
<link rel="stylesheet" href="style.css?v=46">
</head>
<body>
<div id="app">

  <!-- 片頭：點一下進入 → 拔刀斬出 Logo -->
  <section id="splash" class="screen active">
    <div class="sp-embers"></div>
    <div class="sp-gate"><small>棲渺拾光《黃泉燒肉店》粉絲作品</small><b>點一下進入</b></div>
    <div class="sp-stage">
      <img class="sp-chr sp-l" src="art/vn/lee-normal.webp" alt="">
      <img class="sp-chr sp-r" src="art/vn/yutong-normal.webp" alt="">
      <img class="sp-emblem" src="art/emblem.webp" alt="">
      <div class="sp-logo"><span>黃泉燒肉店</span></div>
      <div class="sp-motto">如入火聚，得清涼門</div>
    </div>
    <div class="sp-slash"></div>
    <div class="sp-flash"></div>
  </section>

  <!-- 標題 -->
  <section id="title" class="screen">
    <div class="title-bg"></div>
    <button class="title-gear" data-settings aria-label="設定">⚙</button>
    <div class="title-box">
      <div class="title-kicker">棲渺拾光《黃泉燒肉店》粉絲作品</div>
      <h1>黃泉燒肉店<small>轉珠試玩版</small></h1>
      <p class="title-motto">如入火聚，得清涼門</p>
      <button class="btn gold" data-go="chapters">主線劇情</button>
      <button class="btn" data-go="shop">托夢照相館</button>
      <button class="btn" data-go="dex">卡片圖鑑</button>
      <p class="title-note">v<span class="ver"></span> ‧ 非官方粉絲作品</p>
    </div>
  </section>

  <!-- 章節 -->
  <section id="chapters" class="screen">
    <header class="bar"><button class="back" data-go="title">‹</button><h2>主線劇情</h2><span class="merit-chip"></span></header>
    <div class="ch-list"></div>
  </section>

  <!-- 隊伍 -->
  <section id="team" class="screen">
    <header class="bar"><button class="back" data-go="chapters">‹</button><h2>出擊隊伍</h2><span class="merit-chip"></span></header>
    <div class="stage-card">
      <div class="stage-place"></div>
      <div class="stage-name"></div>
      <div class="stage-intro"></div>
      <div class="stage-waves"></div>
    </div>
    <div class="chal-box" hidden></div>
    <div class="presets"></div>
    <div class="team-slots"></div>
    <div class="team-sum"></div>
    <div class="team-lead"></div>
    <p class="hint">選一組推薦隊伍，或點任一格（隊長、戰友也可以）換成你擁有的任何一張卡。</p>
    <button class="btn gold wide" id="go-battle">出擊</button>
  </section>

  <!-- 戰鬥 -->
  <section id="battle" class="screen">
    <div class="field">
      <div class="field-bg"></div>
      <div class="wave-tag"></div>
      <div class="chal-tag" hidden></div>
      <button class="gear" data-settings aria-label="設定">⚙</button>
      <button class="menu-btn" id="quit">✕</button>
      <div class="enemies"></div>
      <div class="fx-layer"></div>
      <div class="combo"></div>
    </div>
    <div class="party"></div>
    <div class="hpbar"><div class="hp-fill"></div><div class="hp-txt"></div></div>
    <div class="board-wrap"><div class="board"></div><div class="timer"><div class="timer-fill"></div></div></div>
  </section>

  <!-- 托夢照相館 -->
  <section id="shop" class="screen">
    <header class="bar"><button class="back" data-go="title">‹</button><h2>托夢照相館</h2><span class="merit-chip"></span></header>
    <p class="hint shop-note">用「功德」把喜歡的角色請回店裡。通關章節會自動加入劇情裡的角色。</p>
    <div class="shop-grid"></div>
  </section>

  <!-- 圖鑑 -->
  <section id="dex" class="screen">
    <header class="bar"><button class="back" data-go="title">‹</button><h2>卡片圖鑑</h2><span class="merit-chip"></span></header>
    <div class="dex-tabs"></div>
    <div class="dex-head"></div>
    <div class="dex-grid"></div>
  </section>

  <div id="modal" class="modal"><div class="modal-box"></div></div>

  <!-- 劇情對話 -->
  <div id="dialog" class="dialog">
    <div class="dlg-scene-bg"></div>
    <div class="dlg-scene"><img alt=""></div>
    <div class="dlg-intro"></div>
    <div class="vn vn-l"><img alt=""></div>
    <div class="vn vn-r"><img alt=""></div>
    <div class="dlg-box">
      <div class="dlg-name"></div>
      <div class="dlg-text"></div>
      <div class="dlg-ep"></div>
      <span class="dlg-next">▼</span>
    </div>
    <button class="dlg-skip">略過 ››</button>
  </div>
</div>
<script src="data.js?v=46"></script>
<script src="cards.js?v=46"></script>
<script src="profiles.js?v=46"></script>
<script src="story.js?v=46"></script>
<script src="story-ch6.js?v=46"></script>
<script src="story-ch7.js?v=46"></script>
<script src="audio.js?v=46"></script>
<script src="game.js?v=46"></script>
</body>
</html>
